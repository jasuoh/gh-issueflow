# Builds binaries for all platforms when a version tag is pushed, so that
# `gh extension install` doesn't need Go, and attests where each binary came
# from, so that users can check it with `gh attestation verify`.
name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload the binaries
      id-token: write # sign the build provenance attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cli/gh-extension-precompile@76961aa3bd1123d0a6fd42d0a41aca0696937c39 # v2.2.0
        with:
          go_version_file: go.mod
          generate_attestations: true
